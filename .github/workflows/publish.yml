name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # the publish action pushes to the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # If any .qmd executes R, uncomment these two and commit renv.lock.
      # - uses: r-lib/actions/setup-r@v2
      # - uses: r-lib/actions/setup-renv@v2

      # If any .qmd executes Python, uncomment and commit requirements.txt.
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      # - run: pip install -r requirements.txt

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
