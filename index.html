<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gabbro — open source seismic processing</title>
<meta name="description" content="Open source seismic processing. Coming soon.">
<meta property="og:title" content="gabbro">
<meta property="og:description" content="Open source seismic processing. Coming soon.">
<meta property="og:url" content="https://gabbro.ca">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;600&display=swap">
<style>
  :root {
    --trace: #101418;
    --paper: #fdfdfc;
    --positive: #a3241d;
    --negative: #1f4e79;
    --mute: #6b7075;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--trace);
    font: 300 17px/1.6 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .band { border-bottom: 1px solid rgba(16,20,24,.12); }
  .band img { display: block; width: 100%; height: 260px; object-fit: cover; object-position: left top; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 3.5rem 1.5rem; }
  h1 { font-size: 2.6rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 .4rem; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: .72rem; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; color: var(--positive); margin: 0 0 1.8rem;
  }
  p { max-width: 52ch; color: var(--mute); font-size: 1.15rem; }
  p.lede { color: var(--trace); }
  a { color: var(--negative); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: var(--positive); }
  footer {
    border-top: 1px solid rgba(16,20,24,.12);
    padding: 1.2rem 1.5rem;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: .8rem; color: var(--mute);
    display: flex; gap: 1.5rem; flex-wrap: wrap;
    max-width: 640px; margin: 0 auto; width: 100%;
  }
  :focus-visible { outline: 2px solid var(--negative); outline-offset: 3px; }
  @media (max-width: 600px) {
    .band img { height: 170px; }
    h1 { font-size: 2rem; }
    main { padding: 2.5rem 1.25rem; }
  }
</style>
</head>
<body>

<div class="band">
  <img src="hero.svg" alt="A synthetic seismic shot gather: six dipping reflectors rendered as variable-area wiggle traces.">
</div>

<main>
  <h1>gabbro</h1>
  <p class="eyebrow">Coming soon</p>

  <p class="lede">Open source seismic processing, in the open from the start.</p>

  <p>Nothing to install yet. If you'd like to hear when there is,
     write to <a href="mailto:info@gabbro.ca">info@gabbro.ca</a>.</p>
</main>

<footer>
  <span>&copy; 2026</span>
  <a href="mailto:info@gabbro.ca">info@gabbro.ca</a>
</footer>

</body>
</html>
