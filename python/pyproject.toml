[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gabbro"
version = "0.0.1"
description = "Open source seismic processing you can read, fork, and cite."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Girard", email = "aaron.j.girard@gmail.com" }]
keywords = ["seismic", "geophysics", "segy", "seismic-processing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://gabbro.ca"
Documentation = "https://gabbro.ca/docs/"
Repository = "https://github.com/aaronjgirard/gabbro"

[tool.hatch.build.targets.wheel]
packages = ["src/gabbro"]
